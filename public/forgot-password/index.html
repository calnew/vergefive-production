<html lang="en">
<head>

  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32"><link rel="icon" type="image/png" sizes="32x32" href="/Resources/images/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/Resources/images/favicon-16x16.png"><link rel="apple-touch-icon" href="/Resources/images/vergefive-icon-180.png"><link rel="stylesheet" href="/Style/vf-redesign.css">
</head>
<body class="vf-static-page auth-page">
  <header class='site-header'><div class='nav'><a class='brand' href='/'><span class='brand-logo-shell mark'><img src='/Resources/images/verge5-logo-mark.png' alt='Verge Five logo'></span><span>Verge Five</span></a><nav class='nav-links'><a href='/'>Home</a><a href='/whats-inside/'>What's Inside</a><a href='/business-credit-answers/'>Answers</a><a href='/blog/'>Blog</a></nav><div class='nav-actions'><a class='btn ghost' href='/login/'>Login</a><a class='btn' href='/membership/'>Get access</a></div><button class='mobile-toggle' data-menu-toggle aria-label='Open menu'>Menu</button></div><div class='mobile-panel'><a href='/'>Home</a><a href='/whats-inside/'>What's Inside</a><a href='/business-credit-answers/'>Answers</a><a href='/blog/'>Blog</a><a href='/login/'>Login</a><a href='/membership/'>Get access</a></div></header>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="kicker">Password help</p>
      <h1>Reset your password.</h1>
      <p>Enter the email on your Verge Five account. If it matches an account, we will send a reset link.</p>
      <form data-password-reset-request class="auth-form">
        <label>Email<input class="input" name="email" type="email" autocomplete="email" required></label>
        <button class="btn" type="submit">Send reset link</button>
        <div class="auth-message" data-auth-message></div>
      </form>
      <p class="legal">Remembered it? <a href="/login/">Return to login</a>.</p>
    </section>
  </main>
  <script src="/Scripts/vf-redesign.js" defer></script>
</body>
</html>
