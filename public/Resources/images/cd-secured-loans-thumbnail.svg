      <circle cx="32" cy="26" r="12" fill="#16825f"/>
      <text x="58" y="33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0b3558">Deposit secured</text>
      <rect x="254" y="0" width="214" height="52" rx="26" fill="#fff7df" stroke="#e6c36b"/>
      <circle cx="286" cy="26" r="12" fill="#c49b45"/>
      <text x="312" y="33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0b3558">Pay as agreed</text>
