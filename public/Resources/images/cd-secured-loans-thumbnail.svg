      <text x="297" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#071733">CD</text>
      <text x="297" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#5b6473">RESERVE</text>
