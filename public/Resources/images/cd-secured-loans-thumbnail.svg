<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CD-secured business loans thumbnail</title>
  <desc id="desc">A branded Verge Five graphic showing a certificate of deposit, secured loan document, bank building, and repayment path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06172a"/>
      <stop offset="0.52" stop-color="#0b3558"/>
      <stop offset="1" stop-color="#eaf7fb"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23d3e8"/>
      <stop offset="1" stop-color="#16825f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="1" stop-color="#c49b45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#04101f" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1035" cy="118" r="235" fill="#25d7e8" opacity="0.14"/>
  <circle cx="1120" cy="672" r="270" fill="#c49b45" opacity="0.18"/>
  <path d="M0 532 L408 124 L1280 124 L1280 720 L0 720 Z" fill="#ffffff" opacity="0.08"/>

  <g transform="translate(86 78)">
    <rect x="0" y="0" width="1108" height="564" rx="26" fill="#f8fbff" opacity="0.96" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1108" height="564" rx="26" fill="none" stroke="#b7d7ec" stroke-width="3"/>
    <rect x="38" y="38" width="188" height="42" rx="21" fill="#0b3558"/>
    <text x="132" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.4">MODULE 7</text>

    <text x="58" y="156" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#071733">CD-secured</text>
    <text x="58" y="220" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#071733">business loans</text>
    <text x="60" y="272" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#334155">A deposit-backed path to build</text>
    <text x="60" y="310" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#334155">bank relationship history with less risk.</text>

    <g transform="translate(60 368)">
