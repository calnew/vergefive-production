<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Account | Verge Five</title><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap' rel='stylesheet'><style>body{margin:0;background:#0E1A2B;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F1B2D}main{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at top right,#2563eb33,transparent 32%),#0E1A2B}.card{width:min(520px,100%);background:#fff;border-radius:26px;padding:34px;box-shadow:0 26px 80px #0005}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2563EB,#11C5E8);display:grid;place-items:center;color:white;font-weight:800}.k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#2563EB;font-weight:800}h1{margin:0 0 10px;font-size:34px;letter-spacing:-.04em}p{color:#5B6B82;line-height:1.55}label{display:block;margin-top:15px;font-weight:800;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;margin-top:7px;border:1px solid #d6deea;border-radius:13px;padding:13px 14px;font:inherit}button,.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;width:100%;border:none;border-radius:14px;background:#2563EB;color:white;padding:14px 18px;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#EEF3FE;color:#2563EB}.msg{margin-top:14px;font-weight:700;color:#B45309}.ok{color:#15803D}.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}.small{font-size:13px}</style></head><body><main><section class='card'><div class='brand'><div class='logo'>V5</div><div><strong>Verge Five</strong><div class='k'>Business Credit</div></div></div><div class='k'>Member account</div><h1>Business profile.</h1><p>These fields feed the visibility scan and member readiness flow.</p><form id='f'><label>Business name<input name='businessName'></label><label>Formation state<input name='formationState'></label><label>Business phone<input name='phone'></label><label>Business address<input name='address'></label><label>Website<input name='website'></label><label>EIN<input name='ein'></label><button>Save profile</button><a class='btn secondary' href='/dashboard/'>Back to platform</a><button id='portal' type='button' class='secondary'>Billing portal</button><div id='m' class='msg'></div></form></section></main><script>async function api(p,o={}){const r=await fetch(p,Object.assign({credentials:'include',headers:{'content-type':'application/json'}},o));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d} api('/api/member/profile').then(d=>{const p=d.profile||{};for(const el of f.elements){if(el.name){el.value=p[el.name]||p[el.name.replace(/[A-Z]/g,x=>'_'+x.toLowerCase())]||''}}}).catch(e=>{m.textContent=e.message}); f.onsubmit=async e=>{e.preventDefault();m.textContent='Saving...';try{await api('/api/member/profile',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(f)))});m.textContent='Saved.';m.className='msg ok'}catch(err){m.textContent=err.message}}; portal.onclick=async()=>{try{const d=await api('/api/billing/create-portal-session',{method:'POST',body:'{}'});location.href=d.url}catch(e){m.textContent=e.message}};</script></body></html>
